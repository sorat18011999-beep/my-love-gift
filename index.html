<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gift for U 💗</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
            overflow-x: hidden;
            color: #555;
        }

        .page {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            animation: fadeIn .6s ease;
        }

        .page.active {
            display: flex;
        }

        .content {
            width: 100%;
        }

        /* ---------------- หน้าแรก + QR ---------------- */
        h1 {
            color: #ff6f9f;
            margin: 15px 0;
        }

        h2 {
            color: #ff82aa;
        }

        button {
            border: none;
            background: #ff78a5;
            color: white;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 100, 150, .3);
            transition: .2s;
        }

        .back-page {
            background: #fff;
            color: #ff6f9f;
            border: 2px solid #ffb3ca;
            margin-left: 8px;
        }

        .back-page:hover {
            background: #fff3f7;
            transform: scale(1.03);
        }

        button:hover {
            transform: scale(1.05);
            background: #ff5d92;
        }

        /* ---------------- กล่องของขวัญ ---------------- */
        .gift {
            position: relative;
            width: 220px;
            height: 190px;
            margin: 35px auto 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .box {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 180px;
            height: 120px;
            background: #ff91b5;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,.15);
        }

        .lid {
            position: absolute;
            top: 35px;
            left: 10px;
            width: 200px;
            height: 35px;
            background: #ff6f9f;
            border-radius: 6px;
            z-index: 3;
        }

        .ribbon {
            position: absolute;
            left: 95px;
            bottom: 0;
            width: 30px;
            height: 155px;
            background: #fff2a8;
            z-index: 4;
        }

        .ribbon-horizontal {
            position: absolute;
            left: 20px;
            bottom: 50px;
            width: 180px;
            height: 25px;
            background: #fff2a8;
            z-index: 4;
        }

        .bow-left,
        .bow-right {
            position: absolute;
            top: 0;
            width: 65px;
            height: 45px;
            background: #ff6f9f;
            border-radius: 50%;
            z-index: 5;
        }

        .bow-left {
            left: 45px;
            transform: rotate(25deg);
        }

        .bow-right {
            right: 45px;
            transform: rotate(-25deg);
        }

        /* ---------------- Card ---------------- */
        .card {
            background: rgba(255,255,255,.9);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        /* ---------------- Image Slider ---------------- */
        .slider-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 10px auto 15px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            border-radius: 20px;
        }

        .slide-img.active {
            opacity: 1;
        }

        /* กล่องนับวัน */
        .counter-box {
            background: #ffe6f0;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            color: #ff5d92;
            margin-bottom: 15px;
            display: inline-block;
        }

        .message {
            background: #fff3f7;
            border-radius: 18px;
            padding: 20px;
            line-height: 1.9;
            font-size: 16px;
            color: #555;
            text-align: left;
            min-height: 180px;
            white-space: pre-line;
        }

        /* กล่องสุ่มข้อความ */
        .love-quote-box {
            margin-top: 15px;
            padding: 12px;
            background: #fff;
            border: 2px dashed #ff82aa;
            border-radius: 15px;
            color: #ff3b7b;
            font-weight: bold;
            font-size: 15px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        /* ---------------- QR ---------------- */
        .qr-box {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
            cursor: pointer;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        .qr-text {
            margin-top: 15px;
            color: #ff6f9f;
            font-weight: bold;
        }

        .small {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* หัวใจลอย */
        .heart {
            position: fixed;
            bottom: -30px;
            font-size: 20px;
            animation: floatUp 8s linear infinite;
            opacity: .7;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            20% {
                opacity: .8;
            }
            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        .music-control {
            position: fixed;
            right: 15px;
            bottom: 15px;
            z-index: 9999;
            margin: 0;
            padding: 10px 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- 🎵 ไฟล์เพลง (ไม่ต้องมี loop แล้วเพราะใช้ระบบ Playlist) -->
    <audio id="bgMusic" preload="auto"></audio>
    <button id="musicBtn" class="music-control" data-action="music">🎵 เปิดเพลง</button>

    <!-- หน้า 1 : QR Code -->
    <section class="page active">
        <div class="content">
            <div class="qr-box" id="qrClickArea">
                <div id="qrcode"></div>
                <div class="qr-text">
                    สแกนเพื่อเปิดของขวัญ 💗
                </div>
                <div class="small">
                    (หรือคลิกที่ QR Code เพื่อเริ่มเล่นได้เลย 🥰)
                </div>
            </div>
        </div>
    </section>

    <!-- หน้า 2 -->
    <section class="page">
        <div class="content">
            <h2>พร้อมหรือยัง? 🥺</h2>
            <h1>มีของขวัญให้เธอ 🎁</h1>

            <button data-action="next">Next ▶️</button>
            <button class="back-page" data-action="prev">◀️ ย้อนกลับ</button>
        </div>
    </section>

    <!-- หน้า 3 -->
    <section class="page">
        <div class="content">
            <h1>คนเก่งของเค้า 🐶</h1>
            <p>ของขวัญชิ้นนี้ตั้งใจทำให้เธอเลยนะ 💗</p>

            <button data-action="next">Next ▶️</button>
            <button class="back-page" data-action="prev">◀️ ย้อนกลับ</button>
        </div>
    </section>

    <!-- หน้า 4 -->
    <section class="page">
        <div class="content">
            <h2>Gift for U 💗</h2>

            <div class="gift" id="gift" onclick="openGift()">
                <div class="bow-left"></div>
                <div class="bow-right"></div>
                <div class="lid"></div>
                <div class="box"></div>
                <div class="ribbon"></div>
                <div class="ribbon-horizontal"></div>
            </div>

            <button data-action="gift">Open It 🎁</button>
            <button class="back-page" data-action="prev">◀️ ย้อนกลับ</button>
        </div>
    </section>

    <!-- หน้า 5 -->
    <section class="page">
        <div class="content">
            <div class="card">
                <h1>คนเก่งของเค้า 🐶</h1>

                <!-- 🖼️ สไลด์โชว์รูปภาพ -->
                <div class="slider-container">
                    <img src="sorat.jpg" class="slide-img active" alt="รูปที่ 1">
                    <img src="sorat2.jpg" class="slide-img" alt="รูปที่ 2">
                    <img src="sorat3.jpg" class="slide-img" alt="รูปที่ 3">
                    <img src="sorat4.jpg" class="slide-img" alt="รูปที่ 4">
                    <img src="sorat5.jpg" class="slide-img" alt="รูปที่ 5">
                </div>

                <!-- 1. นับวันครบรอบ -->
                <div class="counter-box">
                    เรารักกันมาแล้ว <span id="daysCount" style="font-size: 20px;">0</span> วัน 💖
                </div>

                <!-- 3. ข้อความพิมพ์ทีละตัว -->
                <div class="message" id="typeWriterMessage"></div>

                <!-- 5. สุ่มคำบอกรัก -->
                <button onclick="getRandomLoveQuote()" style="background: #ffb3ca; font-size: 14px; padding: 10px 20px;">
                    🎲 สุ่มคำบอกรักของวันนี้
                </button>
                <div class="love-quote-box" id="quoteBox"></div>

                <br><br>
                <button class="back-page" data-action="prev">◀️ ย้อนกลับ</button>
                <button class="back-page" data-action="first">กลับไปหน้า QR 💗</button>
            </div>
        </div>
    </section>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll(".page");
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");

        bgMusic.volume = 0.4; // ปรับความดังเพลง 40%

        // 🎵 รายชื่อเพลงที่คุณต้องการเพิ่ม (ใส่ชื่อไฟล์ไว้ตรงนี้ได้เลยครับ)
        const playlist = [
            "tai.mp3",
            "song2.mp3",
            "song3.mp3",
            "song4.mp3",
            "song5.mp3"
            
        ];
        let currentTrackIndex = 0;

        function loadTrack(index) {
            bgMusic.src = playlist[index];
        }

        // เมื่อเพลงจบให้เล่นเพลงถัดไปทันที
        bgMusic.addEventListener("ended", function() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            bgMusic.play();
        });

        // โหลดเพลงแรกเตรียมไว้
        loadTrack(currentTrackIndex);

        // 📌 คำนวณวันครบรอบ
        const startDate = new Date(2026, 6, 19); 
        const today = new Date();
        const diffTime = Math.abs(today - startDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        document.getElementById("daysCount").textContent = diffDays;

        // ข้อความจดหมายสำหรับ Typing Effect
        const fullMessage = `เค้าคิดถึงที่รักมากกก 💗\nอยากกอดทุกวัน อยากอยู่ด้วยทุกวันเลย 🥺\nขายของก็สู้ๆ นะ เค้าเป็นกำลังใจให้เสมอ ❤️\nรีบกลับมาให้เค้ากอดนะ 🤗\nอยากจุ๊บๆ 😘\nเค้ารักที่รักที่สุดในโลก ❤️`;
        let typeIndex = 0;
        let isTyping = false;

        function startTypingEffect() {
            const element = document.getElementById("typeWriterMessage");
            element.innerHTML = "";
            typeIndex = 0;
            isTyping = true;

            function type() {
                if (typeIndex < fullMessage.length) {
                    element.innerHTML += fullMessage.charAt(typeIndex) === '\n' ? '<br>' : fullMessage.charAt(typeIndex);
                    typeIndex++;
                    setTimeout(type, 50);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        // คำบอกรักสำหรับสุ่ม
        const loveQuotes = [
            "รักที่รักเพิ่มขึ้นทุกวันเลยนะ 💕",
            "ขอบคุณที่เข้ามาเป็นความสุขของเค้านะครับ 🥰",
            "เหนื่อยไหมคนเก่ง มาให้เค้ากอดหน่อยเร็ว 🤗",
            "รักเธอนะครับ ยิ้มเยอะๆ น้า 😊",
            "ไม่ว่าจะเจออะไร เค้าอยู่ข้างๆ เธอเสมอนะ ❤️",
            "วันนี้ก็น่ารักเหมือนเดิมเลยนะแฟนใครเนี่ย 🐶",
            "เธอพิเศษสำหรับเค้ามากนะ❤️",
            "เค้าจะไม่มีวันหมดรักที่รักนะ🥰",
            "อยู่กับเค้าไปนานๆนะ❤️",
            "สุดสวยของเค้า"
        ];

        function getRandomLoveQuote() {
            const quoteBox = document.getElementById("quoteBox");
            const randomText = loveQuotes[Math.floor(Math.random() * loveQuotes.length)];
            quoteBox.textContent = randomText;
            quoteBox.style.display = "block";
        }

        // 🖼️ ฟังก์ชันสไลด์รูปภาพอัตโนมัติ
        let slideIndex = 0;
        let slideInterval = null;

        function startImageSlider() {
            const slides = document.querySelectorAll(".slide-img");
            if (slides.length <= 1) return;

            if (slideInterval) clearInterval(slideInterval);

            slideInterval = setInterval(() => {
                slides[slideIndex].classList.remove("active");
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add("active");
            }, 3000);
        }

        function showPage(index) {
            if (index < 0 || index >= pages.length) return;
            pages.forEach((page, i) => page.classList.toggle("active", i === index));
            currentPage = index;
            window.scrollTo(0, 0);

            if (index === 4) {
                if (!isTyping) startTypingEffect();
                startImageSlider();
            } else {
                if (slideInterval) clearInterval(slideInterval);
            }
        }

        function nextPage() {
            showPage(Math.min(currentPage + 1, pages.length - 1));
        }

        function prevPage() {
            showPage(Math.max(currentPage - 1, 0));
        }

        function goFirst() {
            showPage(0);
        }

        // เปิดกล่องของขวัญ + ยิงพลุกระดาษ Confetti
        function openGift() {
            const gift = document.getElementById("gift");
            if (gift) gift.style.transform = "scale(1.06) rotate(2deg)";
            
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff6f9f', '#ffb3ca', '#fff2a8', '#ff3b7b']
            });

            setTimeout(() => {
                if (gift) gift.style.transform = "";
                nextPage();
            }, 500);
        }

        // ระบบเสียงเพลง
        function startMusic() {
            bgMusic.play().then(() => {
                musicBtn.textContent = "🔊 ปิดเพลง";
            }).catch((err) => {
                musicBtn.textContent = "🎵 เปิดเพลง";
            });
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                startMusic();
            } else {
                bgMusic.pause();
                musicBtn.textContent = "🎵 เปิดเพลง";
            }
        }

        document.addEventListener("click", function (event) {
            // เมื่อคลิกปุ่มใดๆ ในหน้าเว็บ จะถือว่าเป็นการปฏิสัมพันธ์และเปิดเพลงทันที (ถ้ายังไม่ได้เล่น)
            if (bgMusic.paused && event.target.dataset.action !== "music") {
                startMusic();
            }

            const button = event.target.closest("[data-action]");
            if (!button) return;

            switch (button.dataset.action) {
                case "next": nextPage(); break;
                case "prev": prevPage(); break;
                case "first": goFirst(); break;
                case "gift": openGift(); break;
                case "music": toggleMusic(); break;
            }
        });

        function createQRCode() {
            const qr = document.getElementById("qrcode");
            if (!qr || qr.innerHTML !== "") return;
            new QRCode(qr, {
                text: "https://sorat18011999-beep.github.io/my-love-gift/",
                width: 180,
                height: 180,
                colorDark: "#ff6f9f",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        const qrClickArea = document.getElementById("qrClickArea");
        if (qrClickArea) {
            qrClickArea.addEventListener("click", function () {
                startMusic();
                nextPage();
            });
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = ["💗", "💕", "💖", "💘", "❤️"][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (4 + Math.random() * 4) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        window.addEventListener("DOMContentLoaded", () => {
            createQRCode();
            setInterval(createHeart, 1800);
        });
    </script>
</body>
</html>
